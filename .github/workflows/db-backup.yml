name: VECTA Database Backup & Restore Verification

# Free-tier-compatible backup/recovery for the Supabase Free-plan production
# database (that plan has no automatic backups — see
# docs/operations/BACKUP_RECOVERY.md for the full design rationale).
#
# Every run:
#   1. pg_dump the `public` schema (application data/schema — NOT Supabase
#      Auth/Storage, see the docs for that limitation) in custom format.
#   2. Validates the dump is non-empty and structurally readable
#      (`pg_restore --list`, works offline — no DB connection needed) and
#      that representative VECTA tables are actually present in it.
#   3. Restores the dump into a throwaway Postgres 17 *service container*
#      that exists only for this job and is destroyed when it ends — the
#      "safe isolated test environment" required for a real restore test,
#      at zero cost and zero risk to production.
#   4. Runs representative row-count/foreign-key checks against that
#      restored copy, failing the job (GitHub notifies on failed runs) if
#      anything is missing or broken.
#   5. Uploads the validated dump as a build artifact — GitHub retains it
#      for the configured number of days, giving rolling retention with no
#      extra storage service or credentials.
#
# The job runs INSIDE an official `postgres:17` container so pg_dump/
# pg_restore/psql exactly match the production server version (17.6) —
# no apt package-pinning fragility.
#
# One-time setup required (see docs/operations/BACKUP_RECOVERY.md):
#   Repository → Settings → Secrets and variables → Actions →
#   New repository secret → name: SUPABASE_DB_URL → value: the Supabase
#   "Session pooler" connection string (Dashboard → Project Settings →
#   Database → Connection string → URI → Session pooler tab), with the
#   real database password filled in. Never commit this value anywhere.

on:
  schedule:
    # 18:17 UTC = 02:17 Asia/Kuala_Lumpur — low-traffic hour for this app.
    - cron: "17 18 * * *"
  workflow_dispatch: {}

jobs:
  backup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: postgres:17

    services:
      restore-target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore_test_only
          POSTGRES_DB: restore_check
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Guard — required secret present
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. See docs/operations/BACKUP_RECOVERY.md for setup."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Dump production public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M%SZ)
          echo "BACKUP_STAMP=$STAMP" >> "$GITHUB_ENV"
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=custom \
            --file="vecta_backup_${STAMP}.dump"

      - name: Validate — non-empty and structurally readable
        run: |
          set -euo pipefail
          FILE="vecta_backup_${BACKUP_STAMP}.dump"
          SIZE=$(stat -c%s "$FILE")
          echo "Dump size: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Backup file is suspiciously small (${SIZE} bytes) — likely a failed/empty dump."
            exit 1
          fi
          pg_restore --list "$FILE" > toc.txt
          echo "Table-of-contents entries: $(wc -l < toc.txt)"
          for TBL in profiles users report_sec014 report_sec016 report_sec029 report_acknowledgements transactions overtime_requests shift_handovers duty_records; do
            if ! grep -q "TABLE public ${TBL} " toc.txt; then
              echo "::error::Expected table '${TBL}' not found in backup table-of-contents — schema coverage looks incomplete."
              exit 1
            fi
          done
          echo "All expected representative tables present in backup."

      - name: Restore test — into throwaway Postgres 17 container
        env:
          PGPASSWORD: restore_test_only
        run: |
          set -euo pipefail
          FILE="vecta_backup_${BACKUP_STAMP}.dump"
          pg_restore \
            --no-owner \
            --no-privileges \
            --host=restore-target \
            --port=5432 \
            --username=postgres \
            --dbname=restore_check \
            --jobs=2 \
            "$FILE" || true
          # pg_restore can exit non-zero on benign warnings (e.g. objects it
          # stripped via --no-owner); the real pass/fail signal is the
          # verification queries below actually finding real, linked data.

      - name: Verify restored data — representative tables/counts/integrity
        env:
          PGPASSWORD: restore_test_only
        run: |
          set -euo pipefail
          echo "== Restored schema row counts =="
          psql -h restore-target -U postgres -d restore_check -v ON_ERROR_STOP=1 -c "
            select 'profiles' as table_name, count(*) from profiles
            union all select 'users', count(*) from users
            union all select 'report_sec014', count(*) from report_sec014
            union all select 'report_acknowledgements', count(*) from report_acknowledgements
            union all select 'transactions', count(*) from transactions
            union all select 'duty_records', count(*) from duty_records
            order by 1;
          "
          echo "== Referential integrity check (acknowledgements -> profiles) =="
          psql -h restore-target -U postgres -d restore_check -v ON_ERROR_STOP=1 -c "
            select count(*) as orphaned_acknowledgements
            from report_acknowledgements a
            left join profiles p on p.id = a.acknowledged_by
            where p.id is null;
          "

      - name: Upload backup artifact (rolling retention)
        uses: actions/upload-artifact@v4
        with:
          name: vecta-db-backup-${{ env.BACKUP_STAMP }}
          path: vecta_backup_${{ env.BACKUP_STAMP }}.dump
          retention-days: 30
          if-no-files-found: error
